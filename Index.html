```html
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ஞாயிறு ஊராட்சி — கிராம வளர்ச்சி திட்ட பணிகள்</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.3/papaparse.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fb;
  color: #172033;
  font-family: "Noto Sans Tamil", "Noto Sans", sans-serif;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #111827, #24324a);
  color: #fff;
  padding: 28px 18px;
}

.header-inner {
  max-width: 1180px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
}

.brand {
  font-size: 14px;
  font-weight: 700;
  opacity: .9;
}

h1 {
  margin: 7px 0 4px;
  font-size: clamp(25px, 4vw, 38px);
}

.subtitle {
  margin: 0;
  color: #d7deea;
  font-size: 14px;
}

/* ADMIN BUTTON */
.admin-btn {
  border: 1px solid rgba(255,255,255,.35);
  background: #fff;
  color: #111827;
  border-radius: 10px;
  padding: 11px 16px;
  font-weight: 800;
  cursor: pointer;
  white-space: nowrap;
}

.admin-btn:hover {
  background: #e8edf5;
}

/* MAIN */
main {
  max-width: 1180px;
  margin: 24px auto;
  padding: 0 16px;
}

/* STATS */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}

.stat {
  background: #fff;
  border: 1px solid #e5e9f1;
  border-radius: 14px;
  padding: 17px;
  box-shadow: 0 5px 18px rgba(25,40,70,.05);
}

.stat small {
  color: #68748a;
  display: block;
  margin-bottom: 6px;
}

.stat strong {
  font-size: 28px;
}

/* CONTROLS */
.controls {
  background: #fff;
  border: 1px solid #e5e9f1;
  border-radius: 14px;
  padding: 14px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

input,
select {
  font: inherit;
  border: 1px solid #d5dce8;
  border-radius: 9px;
  padding: 10px 12px;
  background: #fff;
}

.search {
  flex: 1;
  min-width: 220px;
}

.refresh {
  border: 0;
  background: #172033;
  color: #fff;
  border-radius: 9px;
  padding: 10px 15px;
  font-weight: 700;
  cursor: pointer;
}

/* TABLE */
.table-wrap {
  background: #fff;
  border: 1px solid #e5e9f1;
  border-radius: 14px;
  overflow: auto;
  box-shadow: 0 5px 18px rgba(25,40,70,.05);
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
}

th,
td {
  padding: 13px 12px;
  text-align: left;
  border-bottom: 1px solid #edf0f5;
  vertical-align: top;
}

th {
  background: #f8f9fc;
  color: #526078;
  font-size: 13px;
  position: sticky;
  top: 0;
}

td {
  font-size: 14px;
}

/* STATUS */
.badge {
  display: inline-block;
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 800;
}

.completed {
  background: #dcfce7;
  color: #166534;
}

.progress {
  background: #fef3c7;
  color: #92400e;
}

.pending {
  background: #fee2e2;
  color: #991b1b;
}

.unknown {
  background: #e5e7eb;
  color: #374151;
}

.empty {
  text-align: center;
  padding: 35px;
  color: #69758a;
}

/* FOOTER */
.footer {
  padding: 24px 16px;
  text-align: center;
  color: #7b8495;
  font-size: 12px;
}

/* LOGIN MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 50;
}

.modal.show {
  display: flex;
}

.modal-card {
  width: min(420px, 100%);
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
}

.modal-card h2 {
  margin: 0 0 7px;
}

.modal-card p {
  color: #69758a;
  font-size: 13px;
  margin: 0 0 18px;
}

.form-row {
  margin-bottom: 12px;
}

.form-row label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 6px;
}

.form-row input {
  width: 100%;
}

.login-actions {
  display: flex;
  gap: 9px;
  justify-content: flex-end;
  margin-top: 18px;
}

.login-btn,
.cancel-btn {
  border: 0;
  border-radius: 9px;
  padding: 10px 15px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}

.login-btn {
  background: #172033;
  color: #fff;
}

.cancel-btn {
  background: #edf0f5;
  color: #263247;
}

.error {
  color: #b42318;
  font-size: 13px;
  min-height: 20px;
  margin-top: 8px;
}

/* MOBILE */
@media (max-width: 800px) {

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .header-inner {
    align-items: flex-start;
    flex-direction: column;
  }

  .admin-btn {
    align-self: stretch;
  }
}

@media (max-width: 450px) {

  .stats {
    grid-template-columns: 1fr;
  }
}
</style>
